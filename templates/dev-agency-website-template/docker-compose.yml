version: "3.8"

# Local MariaDB for development. After `docker compose up -d`, set in .env:
# DATABASE_URL="mysql://root:password@localhost:3306/app_db"

services:
  db:
    image: mariadb:10
    container_name: tempjs-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: app_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
